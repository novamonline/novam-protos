syntax = "proto3";

package novam.events.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/novamonline/novam-protos/gen/go/novam/events/v1;eventsv1";

// Business events novam-data publishes to NATS JetStream after a write commits. Each message travels as a
// CloudEvent in binary mode: the body is one of the messages below (protobuf), and the CloudEvents
// attributes ride in NATS headers (ce-specversion "1.0", ce-id, ce-source "novam-data", ce-type, ce-time,
// ce-orgid, content-type "application/protobuf").
//
// Subject: novam.events.<org_id>.<entity>.<change>, e.g. novam.events.org-1.appointment.updated.
// ce-type:  novam.<entity>.<change>, e.g. novam.appointment.updated.
// Delivery is at least once: consumers dedupe on ce-id.
//
// Each event carries the entity as it stands after the change (for deleted, as it stood before), so a
// consumer never needs to read novam-data to react to it.

// What happened to the entity.
enum ChangeType {
  CHANGE_TYPE_UNSPECIFIED = 0;
  CHANGE_TYPE_CREATED = 1;
  CHANGE_TYPE_UPDATED = 2;
  CHANGE_TYPE_DELETED = 3;
}

message Appointment {
  string id = 1;
  string org_id = 2;
  string client_id = 3;
  string title = 4;
  google.protobuf.Timestamp start_time = 5;
  google.protobuf.Timestamp end_time = 6;
  string status = 7; // scheduled, completed, cancelled, no-show
  string offering_id = 8; // the service booked; empty when none
}

message AppointmentEvent {
  ChangeType change = 1;
  Appointment appointment = 2;
}

message ClientInvoice {
  string id = 1;
  string org_id = 2;
  string client_id = 3;
  string invoice_number = 4;
  string due_date = 5; // YYYY-MM-DD, a calendar date in the org's time zone
  string status = 6; // draft, sent, paid, overdue, cancelled
  int64 total_cents = 7;
  string currency = 8; // ISO 4217, e.g. USD
}

message ClientInvoiceEvent {
  ChangeType change = 1;
  ClientInvoice invoice = 2;
}

// Only what other services need to address a client; full records stay in novam-data.
message Client {
  string id = 1;
  string org_id = 2;
  string name = 3;
}

message ClientEvent {
  ChangeType change = 1;
  Client client = 2;
}

message ReminderRule {
  string id = 1;
  string org_id = 2;
  string type = 3; // appointment, invoice
  string when = 4; // 2_days_before, 1_day_before, on_date, 1_day_after, 3_days_after, after_visit
  string channel = 5; // email, sms, push
  bool enabled = 6;
  // The owner's own words, with {{first_name}}, {{name}}, {{business}}, {{when}}, {{service}} and
  // {{booking_link}} filled in for each client; empty sends the built-in wording.
  string message = 7;
  // For after_visit: how many days after a visit it goes, when the client has booked nothing since.
  int32 after_days = 8;
  // The services (offerings) an appointment rule is for; empty means all of them.
  repeated string offering_ids = 9;
}

message ReminderRuleEvent {
  ChangeType change = 1;
  ReminderRule rule = 2;
}

// A text or chat message between the business and a client, such as a reply to a reminder. Workflows wait
// for these (wait_for_event); the conversation itself stays in novam-data.
message Message {
  string id = 1;
  string org_id = 2;
  string client_id = 3;
  string channel = 4; // sms, chat
  string direction = 5; // inbound, outbound
  string body = 6;
  google.protobuf.Timestamp created_at = 7;
}

message MessageEvent {
  ChangeType change = 1;
  Message message = 2;
}

// A business's own subscription to Novam: its plan, set when the business subscribes or changes plan. Emitted
// when novam-data applies a Stripe subscription (lib/planBilling.applySubscriptionState), so workflows can
// start when a business subscribes or upgrades.
message Subscription {
  string id = 1;
  string org_id = 2;
  string plan = 3; // launch, pro, team, business, partner
  string status = 4; // active, trialing, past_due
  string previous_plan = 5; // the plan before this change; empty for a first subscription
}

message SubscriptionEvent {
  ChangeType change = 1;
  Subscription subscription = 2;
}

// A record's copy to the business's books (QuickBooks, Xero; ADR-0008 in novam-engine) changing state. Emitted
// when the copy's status changes, not on each retry, so workflows can tell someone when a copy fails or a payment
// is held back as possibly counted twice. id is <provider>:<entity>:<local_id>.
message AccountingSync {
  string id = 1;
  string org_id = 2;
  string provider = 3; // quickbooks, xero
  string entity = 4; // client, invoice, payment, bill
  string local_id = 5; // the Novam record's id
  string origin = 6; // novam: copied from Novam; books: a payment made in the books
  string status = 7; // pending, synced, error, skipped, removed
  string error_code = 8; // with error: auth, rate_limited, unavailable, stale, not_found, invalid, setup
  string message = 9; // why, as the owner reads it: the error, or why it was skipped
  string external_id = 10; // the record's id in the books, once copied
}

message AccountingSyncEvent {
  ChangeType change = 1;
  AccountingSync sync = 2;
}

// The business's connection to its books: connected (a company picked), broken (the books stopped taking
// Novam's token; the owner must connect again) or disconnected. id is the provider.
message AccountingConnection {
  string id = 1;
  string org_id = 2;
  string provider = 3; // quickbooks, xero
  string company_name = 4;
  string status = 5; // connected, broken, disconnected
  string error = 6; // with broken: what the books said
}

message AccountingConnectionEvent {
  ChangeType change = 1;
  AccountingConnection connection = 2;
}
