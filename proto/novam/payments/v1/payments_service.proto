syntax = "proto3";

package novam.payments.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "novam/common/v1/common.proto";

option go_package = "github.com/novamonline/novam-protos/gen/go/novam/payments/v1;paymentsv1";

// PaymentsService runs in novam-engine's workflows server and records a business's payments (ADR-0009): the row and
// what novam-data does around it, in one transaction. novam-data checks who may record it and that the request is
// sound first, then asks here; it reads the payment back to answer.
service PaymentsService {
  // Records a payment on an invoice: the payments row, money a renter's client paid electronically into the
  // business's accounts held for the renter, the loyalty stamp once the invoice is covered, a tip given to the visit's
  // team member when no one is named, and the change feed. With mark_paid_if_covered, the invoice is marked paid once
  // its payments cover it.
  rpc RecordPayment(RecordPaymentRequest) returns (RecordPaymentResponse);
  // Marks an invoice paid once its payments cover it.
  rpc MarkPaidIfCovered(MarkPaidIfCoveredRequest) returns (MarkPaidIfCoveredResponse);
  // An invoice paid by a payment that then failed is owed again: sent, or overdue once past its due date.
  rpc ReopenIfOwed(ReopenIfOwedRequest) returns (ReopenIfOwedResponse);
  // A payment made through Stripe that didn't go through after all (a bank debit returned): it stops counting (failed
  // and deleted), and an invoice it paid is owed again. Safe to repeat.
  rpc FailPayment(FailPaymentRequest) returns (FailPaymentResponse);
  // A refund made in the processor: all of it marks the payment refunded and stops it counting; part of it leaves
  // the payment counting for what is left. The invoice is left as it is.
  rpc RefundPayment(RefundPaymentRequest) returns (RefundPaymentResponse);
  // The client disputed the charge with their bank: the payment is marked disputed.
  rpc DisputePayment(DisputePaymentRequest) returns (DisputePaymentResponse);
  // Deletes a payment; a gift card payment's amount goes back on its card.
  rpc DeletePayment(DeletePaymentRequest) returns (DeletePaymentResponse);
  // Restores a deleted payment; a gift card payment is taken off its card again, or FAILED_PRECONDITION when the
  // card no longer has it.
  rpc RestorePayment(RestorePaymentRequest) returns (RestorePaymentResponse);
  // Takes up to what is asked (all it can by default) off an invoice from a gift card: never more than the card
  // holds or the invoice still owes. The invoice is paid when nothing is left. FAILED_PRECONDITION says why a card
  // or invoice can't be used, NOT_FOUND an invoice that isn't there.
  rpc RedeemGiftCard(RedeemGiftCardRequest) returns (RedeemGiftCardResponse);
  // Autopay: charges the invoices that are due to the wallet method each client chose, logs each try and tells the
  // client and the team, as novam-data's lib/autopay.ts does. Each charge is claimed by its intent row and sent with
  // that row's Idempotency-Key, so it is never made twice, whoever runs it. UNAVAILABLE only before anything was done
  // (the engine can't charge wallets here); after any other error the caller must not try the same invoices itself.
  rpc RunAutopay(RunAutopayRequest) returns (RunAutopayResponse);
  // A client paying an invoice with a wallet method from Passes (or a quote's deposit): on-session, so a card that
  // needs 3-D Secure comes back requires_action with what the app finishes it with. Never charges twice: one intent per
  // invoice in flight, and Stripe's Idempotency-Key is that intent's row. UNAVAILABLE only when the engine can't charge
  // wallets, before anything is done.
  rpc PayInvoice(PayInvoiceRequest) returns (PayInvoiceResponse);
  // After the person finished (or gave up on) 3-D Secure: what Stripe now says of their latest intent is recorded.
  rpc RefreshIntent(RefreshIntentRequest) returns (RefreshIntentResponse);
  // A verified payment_intent.succeeded, .processing or .payment_failed for a wallet intent: the payment recorded
  // once, or failed once. The intent row is found by intent id, else by the attempt id in the intent's metadata (a
  // charge whose answer was lost). Made for any business: the account the event came from is checked.
  rpc ApplyIntentEvent(ApplyIntentEventRequest) returns (ApplyIntentEventResponse);
  // A pay-page checkout just started at the processor: its card_checkouts row.
  rpc OpenCheckout(OpenCheckoutRequest) returns (OpenCheckoutResponse);
  // A checkout the processor says was paid (a signed webhook, or the processor asked): claimed once, its payment
  // recorded with the tip apart, the invoice marked paid even when cancelled since, and the team told.
  rpc SettleCheckout(SettleCheckoutRequest) returns (SettleCheckoutResponse);
  // A bank payment started on the pay page that didn't go through: the open checkout is marked failed.
  rpc FailCheckout(FailCheckoutRequest) returns (FailCheckoutResponse);
  // A Stripe webhook event novam-data verified, for the kinds the engine applies: a business's own Novam plan
  // (subscription checkouts, customer.subscription.*, its bills' invoice.* events and the plan card), a filing order's
  // checkout, and a gift card bought on the business's page or from a wallet. Each is applied once; handled is false
  // for any other kind, which novam-data applies itself. UNAVAILABLE when the engine lacks what the kind needs (Stripe,
  // the plans' prices, a filing partner), before anything is written.
  rpc ApplyStripeEvent(ApplyStripeEventRequest) returns (ApplyStripeEventResponse);
  // Changes a business's Novam plan billed by a Stripe subscription: a first paid plan starts a subscription Checkout,
  // a change between paid plans swaps the price (prorated) at once, and Launch cancels at the end of the paid period.
  // novam-data decides first whether the plan is billed as a Novam membership instead. FAILED_PRECONDITION as
  // novam-data's own refusals.
  rpc ChangePlan(ChangePlanRequest) returns (ChangePlanResponse);
  // A Stripe Checkout page that saves a card for the plan, made with the business's plan customer.
  rpc StartPlanCard(StartPlanCardRequest) returns (StartPlanCardResponse);
  // Makes the card a finished plan-card Checkout saved the default for the plan's bills and its subscription.
  rpc FinishPlanCard(FinishPlanCardRequest) returns (FinishPlanCardResponse);
  // Keeps a paid plan that was cancelled for the end of its period.
  rpc ResumePlan(ResumePlanRequest) returns (ResumePlanResponse);
  // Ends the business's Stripe subscription now (a business being deleted) and puts it on Launch.
  rpc CancelPlanNow(CancelPlanNowRequest) returns (CancelPlanNowResponse);
  // Takes every saved card and bank account off the business's plan customer (a new owner pays with their own).
  rpc DetachPlanMethods(DetachPlanMethodsRequest) returns (DetachPlanMethodsResponse);
}

message RecordPaymentRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  // Chosen by novam-data, so a retried request records the payment once.
  string payment_id = 2;
  string client_invoice_id = 3;
  double amount = 4;
  string method = 5;
  google.protobuf.Timestamp paid_at = 6;
  string notes = 7;
  // A tip on top of the payment; 0 for none.
  double tip = 8;
  string tip_member_id = 9;
  // The person recording it is a renter, who took the money themselves: nothing is held for them.
  bool recorded_by_renter = 10;
  bool mark_paid_if_covered = 11;
}

message RecordPaymentResponse {
  string payment_id = 1;
  // The invoice was marked paid by this call.
  bool invoice_paid = 2;
}

message MarkPaidIfCoveredRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  string client_invoice_id = 2;
  // Mark a cancelled invoice paid too, as the pay page does when the money came in anyway.
  bool even_if_cancelled = 3;
}

message MarkPaidIfCoveredResponse {
  bool invoice_paid = 1;
}

message ReopenIfOwedRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  string client_invoice_id = 2;
}

message ReopenIfOwedResponse {
  bool reopened = 1;
}

message FailPaymentRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  string stripe_payment_intent_id = 2;
  string reason = 3;
}

message FailPaymentResponse {
  // False when there was no counting payment for the intent (already failed, or none).
  bool failed = 1;
  string payment_id = 2;
  string client_invoice_id = 3;
  double amount = 4;
  // The invoice it paid is owed again (novam-data's autopay may charge it).
  bool reopened = 5;
}

message RefundPaymentRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  string payment_id = 2;
  // What the charge took and what went back, in cents.
  int64 charge_amount_cents = 3;
  int64 refunded_cents = 4;
  // The processor says all of it went back.
  bool refunded = 5;
  // ISO 4217, for the note on a part refund.
  string currency = 6;
}

message RefundPaymentResponse {
  bool full = 1;
  // This call changed the payment (the first report of this refund).
  bool changed = 2;
}

message DisputePaymentRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  string payment_id = 2;
}

message DisputePaymentResponse {
  bool changed = 1;
}

message DeletePaymentRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  string payment_id = 2;
}

message DeletePaymentResponse {}

message RestorePaymentRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  string payment_id = 2;
}

message RestorePaymentResponse {}

message RedeemGiftCardRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  // Chosen by novam-data.
  string payment_id = 2;
  string client_invoice_id = 3;
  string code = 4;
  // Unset takes all it can.
  optional double requested = 5;
  // Only an invoice of this client (a client paying their own).
  string client_id = 6;
  // The payment's note; "Gift card <code>" when empty.
  string note = 7;
}

message RedeemGiftCardResponse {
  string payment_id = 1;
  double amount = 2;
  // Left on the card.
  double balance = 3;
  // Left to pay on the invoice.
  double invoice_balance = 4;
  string code = 5;
  bool invoice_paid = 6;
}

message RunAutopayRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  // One invoice of the token's business (it was just sent or saved); empty for all of its due invoices.
  string invoice_id = 2;
  // Every business that allows autopay, whatever the token's business; for novam-data's own sweep.
  bool all_businesses = 3;
}

message RunAutopayResponse {
  // Invoices tried.
  int32 tried = 1;
}

message PayInvoiceRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  string user_id = 2;
  string invoice_id = 3;
  // Empty for the person's default method.
  string method_id = 4;
  // pay (Passes' pay button) or autopay.
  string source = 5;
}

message PayInvoiceResponse {
  // succeeded, processing, requires_action or failed.
  string state = 1;
  string attempt_id = 2;
  string payment_intent_id = 3;
  double amount = 4;
  string currency = 5;
  // requires_action only: what the app finishes 3-D Secure with.
  string client_secret = 6;
  string stripe_account = 7;
  // failed only.
  string error = 8;
  string code = 9;
  string method_id = 10;
}

message RefreshIntentRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  string invoice_id = 2;
  string user_id = 3;
}

message RefreshIntentResponse {
  // none, succeeded, processing, requires_action or failed.
  string state = 1;
  string payment_intent_id = 2;
}

message ApplyIntentEventRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  // payment_intent.succeeded, payment_intent.processing or payment_intent.payment_failed.
  string type = 2;
  string intent_id = 3;
  string last_error = 4;
  // The intent's metadata.attempt_id.
  string attempt_id = 5;
  // The connected account the event came from.
  string account = 6;
}

message ApplyIntentEventResponse {
  // recorded, failed, unknown or ignored.
  string result = 1;
  string attempt_id = 2;
  string org_id = 3;
  string client_invoice_id = 4;
  string user_id = 5;
  string source = 6;
  // A payment the failure flipped, if any.
  string failed_payment_id = 7;
}

message OpenCheckoutRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  string client_invoice_id = 2;
  string processor = 3;
  string session_id = 4;
  double amount = 5;
  string currency = 6;
  string renter_contact_id = 7;
  double tip = 8;
}

message OpenCheckoutResponse {
  string checkout_id = 1;
}

message SettleCheckoutRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  string processor = 2;
  string session_id = 3;
  // Only a checkout of this business, when set.
  string org_id = 4;
  // What the processor took, tip included; unset to take the checkout's own amount and tip.
  optional double amount = 5;
  string currency = 6;
  // Stripe's intent behind it, so a later refund or dispute finds the payment.
  string payment_intent = 7;
  // How the payment is filed: its method (card, paypal) and notes; the processor's name for the team's notice.
  string payment_method = 8;
  string paid_how = 9;
  string processor_name = 10;
  // Taken in person (tap to pay): the team is told only of a second payment.
  bool in_person = 11;
}

message SettleCheckoutResponse {
  // paid, already_paid or unknown.
  string result = 1;
  string payment_id = 2;
}

message FailCheckoutRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  string processor = 2;
  string session_id = 3;
}

message FailCheckoutResponse {
  // failed or unknown.
  string result = 1;
}

message ApplyStripeEventRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  // The event's type, e.g. checkout.session.completed.
  string type = 2;
  // The connected account it came from; empty for the platform account.
  string account = 3;
  // The event's data.object.
  google.protobuf.Struct object = 4;
}

message ApplyStripeEventResponse {
  bool handled = 1;
  // subscription, plan_card, subscription_bill, filing, gift_card or wallet_gift_card.
  string kind = 2;
  // What it did, e.g. paid, already_paid, sent, unpaid, unknown, failed.
  string result = 3;
  // The business it was for, when known.
  string org_id = 4;
  // The record it was about: the gift card, the filing order.
  string id = 5;
  // How a gift card it just made usable reached its recipient: pass, email, text or none. Empty when the engine left
  // delivering it to novam-data (no mail or text provider here), which then sends it once.
  string delivered = 6;
}

message ChangePlanRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  // launch, pro, team or business.
  string plan = 2;
  // monthly or yearly.
  string period = 3;
  // The signed-in person's email, for a Checkout without a customer yet.
  string email = 4;
  // Without the plans' Stripe prices, set the plan anyway: a developer's machine (novam-data's NODE_ENV).
  bool allow_unbilled = 5;
}

message ChangePlanResponse {
  string plan = 1;
  // The Checkout page for a first paid plan; the plan changes once it's paid.
  string checkout_url = 2;
  // The plan that takes over later.
  string pending_plan = 3;
  // When pending_plan takes over, RFC 3339; empty when unknown.
  string effective_time = 4;
  bool billed = 5;
}

message StartPlanCardRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  string email = 2;
}

message StartPlanCardResponse {
  string checkout_url = 1;
}

message FinishPlanCardRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  string session_id = 2;
}

message FinishPlanCardResponse {
  // The saved card's id; empty when the session isn't a finished plan card for this business.
  string payment_method = 1;
}

message ResumePlanRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  // novam-data already took back the Novam membership's cancel: only the cancel reason is cleared.
  bool membership_resumed = 2;
}

message ResumePlanResponse {
  // Whether there was a cancel to undo.
  bool resumed = 1;
}

message CancelPlanNowRequest {
  novam.common.v1.RequestMetadata metadata = 1;
}

message CancelPlanNowResponse {
  bool cancelled = 1;
}

message DetachPlanMethodsRequest {
  novam.common.v1.RequestMetadata metadata = 1;
}

message DetachPlanMethodsResponse {
  int32 detached = 1;
}
