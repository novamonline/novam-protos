syntax = "proto3";

package novam.ai.v1;

import "novam/common/v1/common.proto";
import "novam/entities/v1/ai.proto";

option go_package = "github.com/novamonline/novam-protos/gen/go/novam/ai/v1;aiv1";

// AIService provides chat, summarization and one-off written advice.
service AIService {
  rpc Chat(ChatRequest) returns (ChatResponse);
  rpc Summarize(SummarizeRequest) returns (SummarizeResponse);
  // One piece of written advice from a prompt that carries its own facts, on the model tier the job needs.
  // Stateless and tool-free: the caller gathers the numbers, the model only writes.
  rpc Advise(AdviseRequest) returns (AdviseResponse);
  // A voice conversation with the Reception agent on a chat's Front Desk thread. The caller sends TalkStart
  // first, then the visitor's audio a turn at a time; the agent answers with audio and a transcript of both sides.
  rpc Talk(stream TalkRequest) returns (stream TalkResponse);
}

message TalkRequest {
  oneof event {
    TalkStart start = 1;
    // The visitor's voice: 16 kHz, 16-bit, mono PCM, little-endian.
    bytes audio = 2;
    // The visitor pressed the talk button: a turn begins.
    bool turn_start = 3;
    // The visitor let go: the turn is over and the agent answers.
    bool turn_end = 4;
  }
}

message TalkStart {
  novam.common.v1.RequestMetadata metadata = 1;
  string thread_id = 2;
  // The business's model choice; unset uses the service's default.
  ModelChoice model = 3;
  // The conversation so far (typed or spoken), so a chat can carry on by voice.
  repeated novam.entities.v1.ChatMessage history = 4;
  // One of Gemini Live's prebuilt voices, e.g. Kore; empty uses the model's default voice.
  string voice_name = 5;
}

message TalkResponse {
  oneof event {
    // The agent's voice: 24 kHz, 16-bit, mono PCM, little-endian.
    bytes audio = 1;
    // What the visitor said in the turn that just ended.
    string heard = 2;
    // What the agent said in its answer.
    string said = 3;
    // The agent finished answering; the visitor can talk again.
    bool turn_done = 4;
  }
}

message ChatRequest {
  repeated novam.entities.v1.ChatMessage messages = 1;
  novam.common.v1.RequestMetadata metadata = 2;
  // The business's model choice; unset uses the service's default model and key.
  ModelChoice model = 3;
  // The admin screen the user is on, e.g. /automation/agents; empty when unknown.
  string route = 4;
  // Which agent answers; unspecified is the admin assistant.
  ChatAgent agent = 5;
  // For the Reception agent: the Front Desk thread the chat belongs to.
  string thread_id = 6;
}

// ChatAgent is which agent answers a chat.
enum ChatAgent {
  CHAT_AGENT_UNSPECIFIED = 0;
  // The assistant in the admin: explains Novam Pro and answers from the business's records.
  CHAT_AGENT_ASSISTANT = 1;
  // The Reception agent: talks to a business's clients and only holds times.
  CHAT_AGENT_RECEPTION = 2;
}

// ChatSource says what an assistant reply drew on.
enum ChatSource {
  CHAT_SOURCE_UNSPECIFIED = 0;
  // How Novam Pro works; no business records were read.
  CHAT_SOURCE_GUIDE = 1;
  // At least one of the business's records was read.
  CHAT_SOURCE_RECORDS = 2;
}

// ChatAction is a screen the reply offers to open.
message ChatAction {
  string label = 1;
  // An admin route from the product map, e.g. /automation/agents.
  string route = 2;
  // A part of that screen to highlight, e.g. web-chat; empty for none.
  string spotlight = 3;
}

// ModelChoice is which model answers, and whose key pays for it.
message ModelChoice {
  string provider = 1; // gemini or anthropic; empty means the service's default provider
  string model = 2; // the provider's model id; empty means that provider's default
  // The business's own key for the provider. Empty uses the service's key, which only the default provider has.
  string api_key = 3;
}

message ChatResponse {
  novam.entities.v1.ChatResponse response = 1;
  ChatSource source = 2;
  repeated ChatAction actions = 3;
}

message SummarizeRequest {
  string text = 1;
  novam.common.v1.RequestMetadata metadata = 2;
}

message SummarizeResponse {
  string summary = 1;
}

// How much model a job needs: fast for one-liners and sorting, standard for drafts and questions, deep for heavy
// reasoning such as planning how to close a goal's gap.
enum ModelTier {
  MODEL_TIER_UNSPECIFIED = 0;
  MODEL_TIER_FAST = 1;
  MODEL_TIER_STANDARD = 2;
  MODEL_TIER_DEEP = 3;
}

message AdviseRequest {
  // What to write, with every fact the advice may use; the model is told not to invent others.
  string prompt = 1;
  novam.common.v1.RequestMetadata metadata = 2;
  // Unspecified is standard.
  ModelTier tier = 3;
  // The business's model choice; unset uses the service's default provider at the tier.
  ModelChoice model = 4;
}

message AdviseResponse {
  string text = 1;
}
