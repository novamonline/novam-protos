syntax = "proto3";

package novam.invoices.v1;

import "novam/common/v1/common.proto";

option go_package = "github.com/novamonline/novam-protos/gen/go/novam/invoices/v1;invoicesv1";

// InvoicesService writes a business's client invoices (ADR-0009 step 3), served by novam-engine's workflows server.
// novam-data checks the caller and the request and works out the fields as its resource does; the engine is the one
// writer: the row, the number, discounts and rewards, the stamp, package sessions, the event and the change feed, in
// one transaction. NOT_FOUND: no such invoice in the business. FAILED_PRECONDITION: it can't be done to it as it is.
service InvoicesService {
  rpc CreateInvoice(CreateInvoiceRequest) returns (CreateInvoiceResponse);
  rpc UpdateInvoice(UpdateInvoiceRequest) returns (UpdateInvoiceResponse);
  rpc DeleteInvoice(DeleteInvoiceRequest) returns (DeleteInvoiceResponse);
  rpc UndeleteInvoice(UndeleteInvoiceRequest) returns (UndeleteInvoiceResponse);
  // Before an invoice goes to the client: a number if it has none, and a draft's due date moved to the terms from
  // today when it passed while it waited.
  rpc PrepareSend(PrepareSendRequest) returns (PrepareSendResponse);
  // The invoice went to the client: a draft becomes sent, and sent_at is set the first time.
  rpc MarkSent(MarkSentRequest) returns (MarkSentResponse);
  // Emails the invoice to the client with its PDF and a link to pay it (numbered, a stale draft's due date moved, a
  // draft marked sent), and tells the client's Novam Pro accounts. FAILED_PRECONDITION: deleted, cancelled or paid, or
  // the client has no email address. UNAVAILABLE: the engine has no mail server, so novam-data sends it.
  rpc SendInvoice(SendInvoiceRequest) returns (SendInvoiceResponse);
}

message CreateInvoiceRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  string id = 2;
  // The invoice in the API's field names (client_id, line_items, due_date, status, tax_rate, tax_amount, sent_time…),
  // as novam-data's resource prepared it; an empty invoice_number takes the business's next.
  bytes invoice_json = 3;
}

message CreateInvoiceResponse {
  string id = 1;
}

message UpdateInvoiceRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  string id = 2;
  // The fields to set, in the API's names, as novam-data's resource worked them out.
  bytes values_json = 3;
}

message UpdateInvoiceResponse {}

message DeleteInvoiceRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  string id = 2;
}

message DeleteInvoiceResponse {}

message UndeleteInvoiceRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  string id = 2;
}

message UndeleteInvoiceResponse {}

message PrepareSendRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  string id = 2;
}

message PrepareSendResponse {
  string invoice_number = 1;
  // YYYY-MM-DD.
  string due_date = 2;
}

message MarkSentRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  string id = 2;
}

message MarkSentResponse {}

message SendInvoiceRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  string id = 2;
}

message SendInvoiceResponse {}
