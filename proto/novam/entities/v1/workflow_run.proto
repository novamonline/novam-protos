syntax = "proto3";

package novam.entities.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "novam/common/v1/errors.proto";

option go_package = "github.com/novamonline/novam-protos/gen/go/novam/entities/v1;entitiesv1";

// RunStatus is the status of a workflow run.
enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_PENDING = 1;
  RUN_STATUS_RUNNING = 2;
  RUN_STATUS_SUCCEEDED = 3;
  RUN_STATUS_FAILED = 4;
  RUN_STATUS_CANCELLED = 5;
  // Paused on a wait step until a set time, holding no worker.
  RUN_STATUS_WAITING = 6;
}

// WorkflowRun represents a single execution of a workflow.
message WorkflowRun {
  string id = 1;
  string workflow_id = 2;
  RunStatus status = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp finished_at = 5;
  novam.common.v1.ErrorDetails error = 6; // Set when status is FAILED.
  // The step the run is on (waiting or running there); empty once it has finished.
  string current_node_id = 7;
  // The published version (snapshot) the run follows; empty for the draft.
  string snapshot_id = 8;
  // A test run: steps with side effects reported what they would do, and waits were skipped.
  bool test = 9;
  // Who the run is about: the client of the record that started it, else that record's id.
  string subject_id = 10;
  // The steps the run went through, in order (GetRun only).
  repeated WorkflowRunStep steps = 11;
}

// WorkflowRunStep is one step of a run: a node it ran, and what came of it.
message WorkflowRunStep {
  int32 sequence = 1; // 1-based order within the run
  string node_id = 2;
  string node_kind = 3;
  string status = 4; // running, succeeded, failed, skipped
  string error_message = 5;
  google.protobuf.Struct output = 6; // readable by later steps as steps.<node_id>.output
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp finished_at = 8;
}
