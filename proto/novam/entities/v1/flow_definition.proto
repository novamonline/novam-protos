syntax = "proto3";

package novam.entities.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/novamonline/novam-protos/gen/go/novam/entities/v1;entitiesv1";

// FlowDefinition is the workflow definition header (metadata and entry point).
message FlowDefinition {
  string id = 1;
  string org_id = 2;
  string name = 3;
  string description = 4;
  string entry_node_id = 5;
  bool enabled = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  // What starts this flow's runs. Unset means runs start only through StartRun.
  FlowTrigger trigger = 9;
}

// FlowTrigger is what starts a flow's runs, as the workflow builder saved it.
message FlowTrigger {
  string type = 1; // manual, schedule, event, data_change, webhook
  // Settings for the type, e.g. schedule {cron} or {before: "appointment.start", offsetHours: 24},
  // event {event: "appointment.completed"}, data_change {resource: "clients"}.
  google.protobuf.Struct config = 2;
  bool enabled = 3;
}

// FlowDefinitionNode is a single node in a flow definition (structural, for execution).
message FlowDefinitionNode {
  string id = 1;
  string flow_definition_id = 2;
  string flow_node_kind = 3;
  google.protobuf.Struct config = 4;
  int32 sort_order = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// FlowDefinitionEdge connects two nodes in a flow definition.
message FlowDefinitionEdge {
  string id = 1;
  string flow_definition_id = 2;
  string from_node_id = 3;
  string to_node_id = 4;
  string condition_expression = 5;
  google.protobuf.Timestamp created_at = 6;
  // Which way out of the source node this edge leaves by (FlowNodeExit.key); empty means "next".
  string exit = 7;
  // A node's edges are tried in this order, and the first whose condition passes is taken. Ties fall back to
  // to_node_id, which is how edges were ordered before this field existed.
  int32 sort_order = 8;
  // What the editor shows on the edge, e.g. a branch path's name.
  string label = 9;
}
