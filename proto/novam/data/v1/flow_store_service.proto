syntax = "proto3";

package novam.data.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "novam/common/v1/common.proto";
import "novam/entities/v1/flow_definition.proto";
import "novam/entities/v1/flow_state.proto";

option go_package = "github.com/novamonline/novam-protos/gen/go/novam/data/v1;datav1";

// FlowStoreService is the storage novam-data provides to the services that run flows. novam-data owns
// the data; novam-engine keeps none and calls this to load definitions and save run progress, with its own
// credential (`authorization: Bearer <token>` metadata, a client-credentials token from novam-data's
// /oauth/token). Every call is scoped to `metadata.tenant_context.org_id`.
service FlowStoreService {
  // A flow definition with its nodes and edges, as the engine runs it.
  rpc GetFlowDefinition(GetFlowDefinitionRequest) returns (GetFlowDefinitionResponse);
  // A run (flow instance): status, current node, variables, timing.
  rpc GetFlowInstance(GetFlowInstanceRequest) returns (GetFlowInstanceResponse);
  // Creates or replaces a run. Saving the same update twice is harmless.
  rpc SaveFlowInstance(SaveFlowInstanceRequest) returns (SaveFlowInstanceResponse);
  // A run's process state: envelope and context.
  rpc GetFlowState(GetFlowStateRequest) returns (GetFlowStateResponse);
  // Creates or replaces a run's process state. Saving the same update twice is harmless.
  rpc SaveFlowState(SaveFlowStateRequest) returns (SaveFlowStateResponse);
}

// FlowInstance is one run of a flow definition.
message FlowInstance {
  string id = 1;
  string flow_definition_id = 2;
  string org_id = 3;
  string status = 4; // pending, running, succeeded, failed, cancelled
  string current_node_id = 5;
  google.protobuf.Struct variables = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp finished_at = 8; // unset while running
  string error_message = 9;
}

message GetFlowDefinitionRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  string flow_definition_id = 2;
}

message GetFlowDefinitionResponse {
  novam.entities.v1.FlowDefinition definition = 1;
  repeated novam.entities.v1.FlowDefinitionNode nodes = 2;
  repeated novam.entities.v1.FlowDefinitionEdge edges = 3;
}

message GetFlowInstanceRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  string flow_instance_id = 2;
}

message GetFlowInstanceResponse {
  FlowInstance instance = 1;
}

message SaveFlowInstanceRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  FlowInstance instance = 2;
}

message SaveFlowInstanceResponse {
  FlowInstance instance = 1;
}

message GetFlowStateRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  string flow_instance_id = 2;
}

message GetFlowStateResponse {
  novam.entities.v1.FlowState state = 1;
}

message SaveFlowStateRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  novam.entities.v1.FlowState state = 2;
}

message SaveFlowStateResponse {
  novam.entities.v1.FlowState state = 1;
}
