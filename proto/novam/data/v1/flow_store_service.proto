syntax = "proto3";

package novam.data.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "novam/common/v1/common.proto";
import "novam/common/v1/pagination.proto";
import "novam/entities/v1/flow_definition.proto";
import "novam/entities/v1/flow_state.proto";

option go_package = "github.com/novamonline/novam-protos/gen/go/novam/data/v1;datav1";

// FlowStoreService is the storage novam-data provides to the services that run flows. novam-data owns
// the data; novam-engine keeps none and calls this to load definitions and save run progress, with its own
// credential (`authorization: Bearer <token>` metadata, a client-credentials token from novam-data's
// /oauth/token). Every call is scoped to `metadata.tenant_context.org_id`, except ListScheduledFlowDefinitions
// and ClaimDueFlowInstances, which span orgs.
service FlowStoreService {
  // A flow definition with its nodes and edges, as the engine runs it.
  rpc GetFlowDefinition(GetFlowDefinitionRequest) returns (GetFlowDefinitionResponse);
  // A run (flow instance): status, current node, variables, timing.
  rpc GetFlowInstance(GetFlowInstanceRequest) returns (GetFlowInstanceResponse);
  // Creates or replaces a run. Saving the same update twice is harmless.
  rpc SaveFlowInstance(SaveFlowInstanceRequest) returns (SaveFlowInstanceResponse);
  // A run's process state: envelope and context.
  rpc GetFlowState(GetFlowStateRequest) returns (GetFlowStateResponse);
  // Creates or replaces a run's process state. Saving the same update twice is harmless.
  rpc SaveFlowState(SaveFlowStateRequest) returns (SaveFlowStateResponse);
  // The org's enabled flows that a business event starts: event triggers naming the event, and
  // data_change triggers naming its resource.
  rpc ListFlowDefinitionsForEvent(ListFlowDefinitionsForEventRequest) returns (ListFlowDefinitionsForEventResponse);
  // Enabled flows with a schedule trigger, across all orgs, so the scheduler can work out when each fires.
  rpc ListScheduledFlowDefinitions(ListScheduledFlowDefinitionsRequest) returns (ListScheduledFlowDefinitionsResponse);
  // Atomically leases waiting runs whose wake_at has passed, across all orgs, so each is resumed by one
  // worker only. A lease that runs out without the run being saved returns it to the queue.
  rpc ClaimDueFlowInstances(ClaimDueFlowInstancesRequest) returns (ClaimDueFlowInstancesResponse);
  // Creates or replaces one step of a run, keyed by run and sequence. Saving the same update twice is harmless.
  rpc SaveRunStep(SaveRunStepRequest) returns (SaveRunStepResponse);
  // A run's steps in sequence order.
  rpc ListRunSteps(ListRunStepsRequest) returns (ListRunStepsResponse);
  // Runs parked on a step that waits for an event (wait_for_event) about a subject, such as a reply text from
  // a client, so the event can wake them.
  rpc ListWaitingRuns(ListWaitingRunsRequest) returns (ListWaitingRunsResponse);
  // A flow's runs, newest first, optionally only those with a status or about a subject (the client of the
  // record that started them, else that record). Test runs are left out unless asked for.
  rpc ListFlowInstances(ListFlowInstancesRequest) returns (ListFlowInstancesResponse);
  // Per step of a flow, since a time: how many runs reached it, are on it now, and failed there. Test runs
  // are left out.
  rpc GetFlowStepStats(GetFlowStepStatsRequest) returns (GetFlowStepStatsResponse);
  // Enrolls a subject in a flow under its re-enrollment rule, atomically: "once" allows one enrollment ever,
  // "cooldown" one per cooldown_hours since the last. Enrolling again with the same run_id is allowed, so a
  // redelivered event can still start the run it enrolled.
  rpc RecordEnrollment(RecordEnrollmentRequest) returns (RecordEnrollmentResponse);
}

// FlowInstance is one run of a flow definition.
message FlowInstance {
  string id = 1;
  string flow_definition_id = 2;
  string org_id = 3;
  string status = 4; // pending, running, waiting, succeeded, failed, cancelled
  string current_node_id = 5;
  google.protobuf.Struct variables = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp finished_at = 8; // unset while running
  string error_message = 9;
  // When a waiting run is due to resume; unset unless status is waiting.
  google.protobuf.Timestamp wake_at = 10;
  // The user the run acts for: whoever started it, or the flow's owner for triggered runs.
  string user_id = 11;
  // The published version of the flow the run follows, fixed when it starts; empty follows the draft.
  string snapshot_id = 12;
}

// RunStep is one node execution within a run. A node that runs more than once (a loop) has one step per pass.
message RunStep {
  string flow_instance_id = 1;
  int32 sequence = 2; // 1-based order within the run; unique per run
  string node_id = 3;
  string node_kind = 4;
  string status = 5; // running, succeeded, failed, skipped
  // What the node produced, readable by later steps as steps.<node_id>.output.
  google.protobuf.Struct output = 6;
  string error_message = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp finished_at = 9;
}

message GetFlowDefinitionRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  string flow_definition_id = 2;
  // A published version's nodes and edges instead of the draft's; empty is the draft.
  string snapshot_id = 3;
}

message ListWaitingRunsRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  // The event the runs wait for, e.g. message.created.
  string event = 2;
  // What the event must be about, e.g. the client whose reply the run waits for.
  string subject_id = 3;
}

message ListWaitingRunsResponse {
  repeated FlowInstance instances = 1;
}

message ListFlowInstancesRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  string flow_definition_id = 2;
  // pending, running, waiting, succeeded, failed or cancelled; empty for all.
  string status = 3;
  string subject_id = 4;
  bool include_test = 5;
  novam.common.v1.PageRequest page = 6;
}

message ListFlowInstancesResponse {
  repeated FlowInstance instances = 1;
  novam.common.v1.PageResponse page = 2;
}

message GetFlowStepStatsRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  string flow_definition_id = 2;
  // Only runs on this published version; empty for every version.
  string snapshot_id = 3;
  // Only runs started since then; unset for the last 30 days.
  google.protobuf.Timestamp since = 4;
}

message FlowStepStat {
  string node_id = 1;
  int32 reached = 2; // runs that reached the step
  int32 here = 3; // runs on the step now (pending, running or waiting there)
  int32 failed = 4; // times the step failed
}

message GetFlowStepStatsResponse {
  int32 runs = 1; // runs counted
  repeated FlowStepStat steps = 2;
}

message RecordEnrollmentRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  string flow_definition_id = 2;
  string subject_id = 3;
  // The run this enrollment would start.
  string run_id = 4;
  // once or cooldown.
  string policy = 5;
  // For cooldown: hours before the subject may enroll again (720 when unset).
  double cooldown_hours = 6;
}

message RecordEnrollmentResponse {
  // True when the run may start; false when the rule refused it.
  bool enrolled = 1;
  // The run of the enrollment in force (this one when enrolled).
  string run_id = 2;
  google.protobuf.Timestamp enrolled_at = 3;
  int32 count = 4; // times the subject has enrolled in this flow
}

message GetFlowDefinitionResponse {
  novam.entities.v1.FlowDefinition definition = 1;
  repeated novam.entities.v1.FlowDefinitionNode nodes = 2;
  repeated novam.entities.v1.FlowDefinitionEdge edges = 3;
}

message GetFlowInstanceRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  string flow_instance_id = 2;
}

message GetFlowInstanceResponse {
  FlowInstance instance = 1;
}

message SaveFlowInstanceRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  FlowInstance instance = 2;
}

message SaveFlowInstanceResponse {
  FlowInstance instance = 1;
}

message GetFlowStateRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  string flow_instance_id = 2;
}

message GetFlowStateResponse {
  novam.entities.v1.FlowState state = 1;
}

message SaveFlowStateRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  novam.entities.v1.FlowState state = 2;
}

message SaveFlowStateResponse {
  novam.entities.v1.FlowState state = 1;
}

message ListFlowDefinitionsForEventRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  string event = 2; // e.g. appointment.completed
  string resource = 3; // the changed resource, e.g. appointments
}

message ListFlowDefinitionsForEventResponse {
  repeated novam.entities.v1.FlowDefinition definitions = 1;
}

message ListScheduledFlowDefinitionsRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListScheduledFlowDefinitionsResponse {
  repeated novam.entities.v1.FlowDefinition definitions = 1;
  string next_page_token = 2;
}

message ClaimDueFlowInstancesRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  google.protobuf.Timestamp now = 2;
  int32 limit = 3;
  int32 lease_seconds = 4;
}

message ClaimDueFlowInstancesResponse {
  repeated FlowInstance instances = 1;
}

message SaveRunStepRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  RunStep step = 2;
}

message SaveRunStepResponse {
  RunStep step = 1;
}

message ListRunStepsRequest {
  novam.common.v1.RequestMetadata metadata = 1;
  string flow_instance_id = 2;
}

message ListRunStepsResponse {
  repeated RunStep steps = 1;
}
