version: v2
plugins:
  # Go — NOVAM Engine (messages + gRPC server stubs)
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.6.1
    out: gen/go
    opt: paths=source_relative
  # TypeScript — NOVAM Data and Portal (ES modules, with .d.ts)
  - remote: buf.build/bufbuild/es:v2.11.0
    out: gen/ts
    opt:
      - target=js+dts
      - import_extension=js
